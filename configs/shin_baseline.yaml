project_name: "NCDN_SCDM_Baseline"
seed: 42
device: "cuda:1"

data:
  raw_dir: "datasets/raw"
  processed_dir: "datasets/processed"
  target_modality: "HbR"          # 可选 "HbR" 或 "HbO"
  batch_size: 16
  num_workers: 4
  train_ratio: 0.8

model:
  time_dim: 64
  timesteps: 1000
  beta_start: 0.0001
  beta_end: 0.02

train:
  epochs: 200
  lr: 0.0002
  weight_decay: 0.00001
  save_interval: 20
  checkpoint_dir: "checkpoints"
  output_dir: "outputs"